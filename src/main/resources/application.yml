# Configuração comum a todos os perfis.
# Nenhuma credencial fica aqui: os valores vêm de variáveis de ambiente.
spring:
  application:
    name: clothing-rental

  profiles:
    # Perfil usado quando nenhum outro é informado (SPRING_PROFILES_ACTIVE).
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clothing_rental}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Evita consultas ao banco durante a renderização das páginas;
    # todo acesso a dados deve acontecer na camada de serviço.
    open-in-view: false
    hibernate:
      # O Hibernate NUNCA cria ou altera tabelas: apenas confere se as entidades
      # batem com o esquema. Quem cria e evolui o esquema é o Flyway.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
