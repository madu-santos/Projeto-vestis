<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

    <!--
        Barra Lateral Administrativa Compartilhada (Auditada - Prompt 11)
        - Largura fixa: 220px
        - Fundo: #60342F
        - Destaque ativo: #874941
        - Itens: Início, Peças, Solicitações, Locações, Clientes, Configurações, Sair
        - Sem links que levem a 404 (indicação de 'Em breve' para módulos futuros)
    -->
    <aside th:fragment="sidebar(activeNav)" class="admin-sidebar" id="adminSidebar">
        <!-- Logo Oficial Vestis (Versão Branca para fundo escuro) -->
        <div class="admin-sidebar-brand">
            <a th:href="@{/admin}" title="Painel Administrativo Vestis">
                <div th:replace="~{fragments/brand :: logo('light')}"></div>
            </a>
        </div>

        <!-- Menu de Navegação -->
        <nav class="admin-sidebar-menu" aria-label="Menu principal">
            <!-- 1. Início -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'home' or activeNav == null} ? 'active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Início</span>
            </a>

            <!-- 2. Peças (Em breve) -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'pecas'} ? 'active' : ''"
               title="Módulo de catálogo em preparação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <span>Peças</span>
                <span class="admin-nav-badge">Em breve</span>
            </a>

            <!-- 3. Solicitações (Em breve) -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'solicitacoes'} ? 'active' : ''"
               title="Módulo de solicitações em preparação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span>Solicitações</span>
                <span class="admin-nav-badge">Em breve</span>
            </a>

            <!-- 4. Locações (Em breve) -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'locacoes'} ? 'active' : ''"
               title="Módulo de locações e agenda em preparação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Locações</span>
                <span class="admin-nav-badge">Em breve</span>
            </a>

            <!-- 5. Clientes (Em breve) -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'clientes'} ? 'active' : ''"
               title="Módulo de gestão de clientes em preparação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Clientes</span>
                <span class="admin-nav-badge">Em breve</span>
            </a>

            <!-- 6. Configurações (Em breve) -->
            <a th:href="@{/admin}" 
               class="admin-nav-item" 
               th:classappend="${activeNav == 'configuracoes'} ? 'active' : ''"
               title="Configurações da loja em preparação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Configurações</span>
                <span class="admin-nav-badge">Em breve</span>
            </a>
        </nav>

        <!-- 7. Sair (Base) -->
        <div class="admin-sidebar-footer">
            <form th:action="@{/logout}" method="post" class="admin-logout-form">
                <button type="submit" class="admin-logout-btn" title="Encerrar sessão de forma segura">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sair</span>
                </button>
            </form>
        </div>
    </aside>

</body>
</html>
