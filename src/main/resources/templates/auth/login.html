<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesse sua conta — Vestis</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        .login-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-color: var(--color-background);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--card-radius); /* 14px */
            box-shadow: var(--shadow-sm);
            padding: 36px 32px 28px;
            text-align: center;
        }
        .login-brand-header {
            margin-bottom: 24px;
        }
        .login-brand-header .vestis-brand-vertical .vestis-brand-svg {
            width: 68px;
            height: 68px;
            margin-bottom: 12px;
        }
        .login-card-title {
            font-size: 26px;
            margin-bottom: 6px;
            color: var(--color-text);
        }
        .login-card-subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
            margin: 0;
        }
        .login-footer-text {
            font-size: 12px;
            color: var(--color-text-light);
            margin-top: 24px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<main class="login-page-wrapper">
    <div class="login-card">
        <!-- Logo Oficial Vestis (Layout Vertical Marrom) -->
        <div class="login-brand-header">
            <a th:href="@{/}" title="Vestis">
                <div th:replace="~{fragments/brand :: logo('dark')}"></div>
            </a>
            <h1 class="login-card-title">Acesse sua conta</h1>
            <p class="login-card-subtitle">Entre com suas credenciais para continuar.</p>
        </div>

        <!-- Alertas de Erro ou Logout -->
        <div th:if="${param.error}" class="vestis-alert vestis-alert-danger text-start" role="alert">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Usuário ou senha inválidos.</span>
        </div>

        <div th:if="${param.logout}" class="vestis-alert vestis-alert-success text-start" role="status">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Você saiu do sistema.</span>
        </div>

        <!-- Formulário Seguro com CSRF Automático via th:action -->
        <form th:action="@{/login}" method="post" class="text-start">
            <div class="vestis-form-group">
                <label for="username" class="vestis-label">Usuário</label>
                <div class="vestis-input-wrap">
                    <span class="vestis-input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="vestis-input has-icon" 
                           placeholder="Seu nome de usuário" 
                           autocomplete="username" 
                           required 
                           autofocus>
                </div>
            </div>

            <div class="vestis-form-group">
                <label for="password" class="vestis-label">Senha</label>
                <div class="vestis-input-wrap">
                    <span class="vestis-input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="vestis-input has-icon" 
                           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" 
                           autocomplete="current-password" 
                           required>
                </div>
            </div>

            <button type="submit" class="btn-vestis-primary w-100 mt-3" style="font-size: 15px;">
                <span>Entrar</span>
            </button>
        </form>

        <p class="login-footer-text">Acesso exclusivo para funcionários das lojas.</p>
    </div>
</main>

</body>
</html>
